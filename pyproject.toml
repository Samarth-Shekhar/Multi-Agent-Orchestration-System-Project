[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitpilot"
version = "0.1.0"
description = "Multi-agent LangGraph system that turns GitHub issues into tested pull requests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Samarth Shekhar"},
]
keywords = ["langgraph", "multi-agent", "github", "automation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "GitPython>=3.1.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "respx>=0.21.0",
]
ollama = [
    "ollama>=0.3.0",
]

[project.scripts]
gitpilot = "gitpilot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["src", "examples"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gitpilot"]
